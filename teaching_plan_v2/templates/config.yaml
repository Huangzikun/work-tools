# 教案生成工具V2 配置文件

# AI配置
ai:
  model: "doubao-seed-1-6-251015"  # 支持Responses API的模型
  api_key_env: "ARK_API_KEY"  # API密钥环境变量名
  timeout: 1800  # 30分钟超时（秒）
  max_retries: 2  # 失败重试次数

# 模板和输出配置
template:
  path: "理论课教案-V1.docx"  # Word模板路径
  output_dir: "generated_plans"  # 输出目录

# 解析配置
parser:
  batch_size: 2  # 每批生成的教案数

# 日志配置
logging:
  level: "INFO"  # 日志级别: DEBUG, INFO, WARNING, ERROR
  file: "teaching_plan_v2.log"  # 日志文件名
